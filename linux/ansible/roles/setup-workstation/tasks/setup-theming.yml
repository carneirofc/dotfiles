---
- name: "Theming packages"
  community.general.pacman:
    name: "{{ theming_packages }}"
    state: present
  become: true

- name: "Theming optional packages"
  include_tasks: install-optional.yml
  vars:
    optional_packages: "{{ theming_optional_packages }}"

- name: "matugen old config link"
  include_tasks: remove-links.yml
  vars:
    link_paths: ["{{ matugen_dotdir }}"]

# preserve keeps set-wallpaper.sh executable.
- name: "matugen config"
  copy:
    src: "{{ playbook_dir }}/../matugen/"
    dest: "{{ matugen_dotdir }}/"
    mode: preserve

# The wallpaper lives in a different place on each machine (set it in
# local.yml); only theme from it when it's actually there.
- name: "Wallpaper file"
  stat:
    path: "{{ theming_wallpaper }}"
  register: wallpaper_stat
  when: theming_wallpaper | length > 0

- name: "Wallpaper to theme from"
  set_fact:
    theming_wallpaper_file: "{{ theming_wallpaper | expanduser if wallpaper_stat.stat.exists | default(false) else '' }}"

- name: "Wallpaper missing"
  debug:
    msg: "theming_wallpaper not found on this machine: {{ theming_wallpaper }}; fix it in linux/ansible/local.yml."
  when:
    - theming_wallpaper | length > 0
    - theming_wallpaper_file | length == 0

- name: "KDE Plasma tooling"
  stat:
    path: /usr/bin/kwriteconfig6
  register: kwriteconfig6

- name: "Plasma Login Manager user"
  getent:
    database: passwd
    key: plasmalogin
    fail_key: false

- name: "KDE Plasma look"
  command: "{{ playbook_dir }}/../kde/apply.sh"
  changed_when: false
  when: kwriteconfig6.stat.exists

# Setting the wallpaper talks to plasmashell, so it needs a running session.
- name: "Wallpaper and matugen palette"
  command:
    argv:
      - "{{ matugen_dotdir | expanduser }}/set-wallpaper.sh"
      - "{{ theming_wallpaper_file }}"
  changed_when: false
  when:
    - theming_wallpaper_file | length > 0
    - kwriteconfig6.stat.exists
    - "'KDE' in ansible_facts['env'].XDG_CURRENT_DESKTOP | default('')"
    - ansible_facts['env'].DBUS_SESSION_BUS_ADDRESS is defined

- name: "Wallpaper skipped"
  debug:
    msg: "No Plasma session here; run ~/.config/matugen/set-wallpaper.sh from inside Plasma."
  when:
    - theming_wallpaper_file | length > 0
    - "'KDE' not in ansible_facts['env'].XDG_CURRENT_DESKTOP | default('') or ansible_facts['env'].DBUS_SESSION_BUS_ADDRESS is not defined"

# Last, so the greeter gets the palette and icons generated above.
- name: "Login screen matches the session"
  command:
    argv: "{{ [playbook_dir ~ '/../kde/sync-login.sh', ansible_facts['env'].HOME] + ([theming_wallpaper_file] if theming_wallpaper_file | length > 0 else []) }}"
  become: true
  changed_when: false
  when:
    - kwriteconfig6.stat.exists
    - ansible_facts.getent_passwd.plasmalogin is not none
