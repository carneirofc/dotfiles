---
- name: "Fastfetch package"
  community.general.pacman:
    name: fastfetch
    state: present
  become: true

- name: "Fastfetch config directory"
  file:
    path: "{{ fastfetch_dotdir }}"
    state: directory

- name: "Fastfetch settings"
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  with_items: "{{ fastfetch_settings }}"
