# -------- general ---------
user: "{{ ansible_facts['user_id'] }}"
dotdir: "~/.config"

# -------- packages --------
# Installed with pacman by setup-packages.yml.
base_packages:
  - git
  - ripgrep
  - fd
  - jq
  - fzf
  - bat
  - ttf-jetbrains-mono-nerd

# ------- Alacritty --------
alacritty_dotdir: "{{ dotdir }}/alacritty"
alacritty_settings: [] # { "src": ..., "dest": ... } simple file copy

# --------- Kitty ----------
kitty_dotdir: "{{ dotdir }}/kitty"
kitty_settings: [] # { "src": ..., "dest": ... } simple file copy

# --------- Zellij ---------
zellij_dotdir: "{{ dotdir }}/zellij"
# matugen's wallpaper palette when theming is on, else the repo theme.
zellij_theme: "{{ 'matugen' if setup_theming | default(false) | bool else 'carneirofc-mocha' }}"

# ------- Fastfetch --------
fastfetch_dotdir: "{{ dotdir }}/fastfetch"
fastfetch_settings: [] # { "src": ..., "dest": ... } simple file copy

# -------- Theming ---------
matugen_dotdir: "{{ dotdir }}/matugen"
theming_wallpaper: "" # image to theme from; empty = only link configs and apply the KDE look
theming_packages:
  - matugen
  - papirus-icon-theme
# Installed only when a configured repo carries them (e.g. CachyOS; AUR elsewhere).
theming_optional_packages:
  - kwin-effect-rounded-corners

# ---------- ZSH -----------
zsh_dotdir: "{{ dotdir }}/zsh"
zsh_bin: "/usr/bin/zsh"
zsh_path: "/usr/share/zsh" # system zsh dir; plugins live in its plugins/
zsh_p10k_theme: "/usr/share/zsh-theme-powerlevel10k"
zsh_login_shell: false # chsh to zsh
zsh_packages:
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - zsh-history-substring-search
zsh_optional_packages:
  - zsh-theme-powerlevel10k

zsh_settings: [] # { "src": ..., "dest": ...} simple file copy
zsh_template_settings: [] # jinja templates

# ---------- NVIM ----------
nvim_dotdir: "{{ dotdir }}/nvim"
nvim_packages:
  - neovim
  - python-pynvim
  - nodejs
  - npm
  - clang
  - mdformat
