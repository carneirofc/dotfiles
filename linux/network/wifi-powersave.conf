# NetworkManager drop-in: /etc/NetworkManager/conf.d/wifi-powersave.conf
#
# Disable Wi-Fi power saving globally. On Intel cards (AX210/iwlwifi in
# particular) power save reliably wedges idle connections — an open SSH prompt
# with no traffic stops receiving until something forces the radio awake.
#
# 2 = disable, 3 = enable. This sets the default for every wifi connection;
# a per-connection `802-11-wireless.powersave` value still overrides it.

[connection]
wifi.powersave = 2
